[package]
name = "command-center"
# Kept in step with the root package.json, which is the source of truth. This
# is what the OpenAI User-Agent header reports.
version = "1.1.0"
description = "Local-first library for terminal commands, scripts, and snippets"
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "command_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "2"
sha2 = "0.10"
keyring = "4.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Already in the tree via Tauri. Named here for the Codex process and its
# JSON-RPC connection, which need child processes, timeouts, and channels.
tokio = { version = "1", features = ["process", "io-util", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
