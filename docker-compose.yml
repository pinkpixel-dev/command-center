# Self-hosted Command Center.
#
# Set a password, pick where the data lives, and bring it up:
#
#   COMMAND_CENTER_PASSWORD='something long' docker compose up -d
#
# Then open http://<this machine>:8787 and sign in with that password.

services:
  command-center:
    image: pinkpixeldev/command-center:latest
    container_name: command-center
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    volumes:
      # One mount covers the library and the Codex login, because both sit
      # under the data directory.
      - command-center-data:/var/lib/command-center
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /usr/local/bin/codex-bin ]; then
          mv /usr/local/bin/codex /usr/local/bin/codex-bin
          cat << 'SUBEOF' > /usr/local/bin/codex
        #!/bin/sh
        ARGS=""
        for a in "$$@"; do
          case "$$a" in
            *cli_auth_credentials_store=*keyring*)
              ARGS="$$ARGS cli_auth_credentials_store=\"file\""
              ;;
            *)
              ARGS="$$ARGS \"$$a\""
              ;;
          esac
        done
        eval exec /usr/local/bin/codex-bin $$ARGS
        SUBEOF
          chmod +x /usr/local/bin/codex
        fi
        exec su -m -s /bin/sh command-center -c "exec /usr/bin/tini -- /usr/local/bin/docker-entrypoint.sh command-center-server"

volumes:
  command-center-data:
